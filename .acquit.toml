# Acquit analyzes the repository from its Git root. MediAgent's Python package
# uses a nested src layout, so declare its import roots explicitly.
roots = ["backend/src", "backend"]

# Backend pytest never reads these frontend, editor-configuration, and
# project-management trees. Changes here cannot alter Python test behavior;
# frontend CI remains responsible for apps and shared TypeScript packages.
assume_inert = [
  ".agent/**",
  "apps/**",
  ".cursor/**",
  "*.md",
  "docs/**",
  "meetings/**",
  "packages/**",
]

# These commands are not importable application modules or pytest targets. Acquit
# 0.3 verifies that assertion against the analyzed tree before it can narrow R008
# (`sys.path` mutation); an invalid declaration fails closed to the full suite.
isolated_entrypoints = [
  "backend/scripts/benchmark_document_intelligence.py",
  "backend/scripts/compare_providers.py",
  "backend/scripts/verify_authorization_denials.py",
]
