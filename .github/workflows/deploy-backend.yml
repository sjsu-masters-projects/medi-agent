name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PROJECT_ID: medi-agent-490106
  REGION: us-central1
  SERVICE_NAME: mediagent-backend
  WORKER_SERVICE_NAME: mediagent-chat-worker
  INGESTION_JOB_NAME: mediagent-document-ingestion
  KNOWLEDGE_JOB_NAME: mediagent-health-knowledge-refresh
  RUNTIME_SERVICE_ACCOUNT: github-actions-deployer@medi-agent-490106.iam.gserviceaccount.com

permissions:
  contents: read

# One deploy at a time, in push order. Two merges a few seconds apart once ran in
# parallel: the older build finished last, took the traffic and deleted the newer image.
# A queued run waits rather than cancelling the one in progress; when several are queued,
# only the newest runs, and it builds the latest main.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Create Artifact Registry Repository (if not exists)
        run: |
          gcloud artifacts repositories create cloud-run-source-deploy \
            --repository-format=docker \
            --location=${REGION} \
            --description="Docker repository for Cloud Run deployments" || true

      - name: Apply Artifact Registry cleanup policy
        run: |
          gcloud artifacts repositories set-cleanup-policies cloud-run-source-deploy \
            --location=${REGION} \
            --policy=backend/cleanup-policy.json

          gcloud artifacts repositories list-cleanup-policies cloud-run-source-deploy \
            --location=${REGION}

      - name: Build Docker Image
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"
          docker build -t $IMAGE_PATH ./backend
          docker push $IMAGE_PATH

      - name: Clean up old images
        run: |
          IMAGE_REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}"

          gcloud artifacts docker images list \
            "${IMAGE_REPO}" \
            --include-tags \
            --format="get(version)" \
            --filter="NOT tags:latest" | sort -u | while read -r digest; do
              if [ -z "${digest}" ]; then
                continue
              fi

              echo "Deleting old image: $digest"
              gcloud artifacts docker images delete \
                "${IMAGE_REPO}@${digest}" \
                --quiet
          done

      - name: Deploy to Cloud Run
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"
          
          # Memory is pinned here on purpose. It was 512Mi, which silently reverted any
          # console change on the next deploy, and it is too small for the agent runtime.
          #
          # Environment and secrets use the --update-* forms, never --set-*. The service
          # carries 12 environment variables and 10 secret references (Supabase, Sentry,
          # SMART, Deepgram, Resend, cron) that are configured out of band; --set-env-vars
          # and --set-secrets REPLACE the whole set and would wipe them on the next push.
          # --update-* merges, so anything not named here is preserved.
          #
          # --no-cpu-throttling keeps CPU allocated outside requests. A Nora reply is a
          # server-owned task that keeps running after its websocket closes, and a
          # throttled instance would stall it. Main service only; the jobs are unchanged.
          gcloud run deploy ${SERVICE_NAME} \
            --image $IMAGE_PATH \
            --region ${REGION} \
            --cpu 1 \
            --no-cpu-throttling \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 2 \
            --allow-unauthenticated \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --update-env-vars VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,CHAT_TURN_TIMEOUT_SECONDS=30,MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS=60 \
            --port 8080 \
            --timeout 300

      # OPS-006 phase 2. Creates and updates the Nora turn worker only when the repository
      # variable DEPLOY_CHAT_WORKER is "true", so merging this file creates nothing. The
      # worker is the same image started with WORKER_MODE=true: it serves /health and the
      # OIDC-protected task endpoint only, and Cloud Run rejects unauthenticated callers
      # before the application sees them. Request-based CPU (--cpu-throttling): a turn runs
      # inside its task request, so no CPU is needed between requests. See
      # docs/chat-worker-setup.md for the one-time resources this step expects (the invoker
      # service account, the queue and the repository variable CHAT_WORKER_INVOKER_SA).
      - name: Deploy chat worker service
        if: ${{ vars.DEPLOY_CHAT_WORKER == 'true' }}
        env:
          CHAT_WORKER_INVOKER_SA: ${{ vars.CHAT_WORKER_INVOKER_SA }}
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          if [ -z "${CHAT_WORKER_INVOKER_SA}" ]; then
            echo "::error::Set the repository variable CHAT_WORKER_INVOKER_SA before enabling DEPLOY_CHAT_WORKER."
            exit 1
          fi

          # Environment and secrets use the --update-* forms, as for the API: anything not
          # named here is preserved. The worker needs the database and the model; it has no
          # user-facing secrets (no Resend, Deepgram or SMART).
          gcloud run deploy ${WORKER_SERVICE_NAME} \
            --image $IMAGE_PATH \
            --region ${REGION} \
            --cpu 1 \
            --cpu-throttling \
            --memory 2Gi \
            --min-instances 0 \
            --max-instances 3 \
            --concurrency 4 \
            --timeout 300 \
            --port 8080 \
            --no-allow-unauthenticated \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --update-env-vars WORKER_MODE=true,ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID},CHAT_WORKER_INVOKER_SA=${CHAT_WORKER_INVOKER_SA},VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,CHAT_TURN_TIMEOUT_SECONDS=30,MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS=60,A2A_RETRY_WORKER_ENABLED=false \
            --update-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest

          # The OIDC audience is the service's own URL, known only after it exists. Setting
          # it as an environment variable (not a secret) keeps the worker self-describing.
          WORKER_URL="$(gcloud run services describe ${WORKER_SERVICE_NAME} --region ${REGION} --format='value(status.url)')"
          gcloud run services update ${WORKER_SERVICE_NAME} \
            --region ${REGION} \
            --update-env-vars CHAT_WORKER_URL=${WORKER_URL},CHAT_WORKER_OIDC_AUDIENCE=${WORKER_URL}
          echo "Worker URL (use it as CHAT_WORKER_URL on the API service): ${WORKER_URL}"

      - name: Deploy document-ingestion job
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # A Cloud Run Job resolves an image tag to a digest at deploy time. Updating
          # it beside the backend service prevents its OCR/extraction code from drifting
          # behind the request path after a later backend release. This command is also
          # safe as the initial creation path: it declares the whole worker runtime
          # contract without ever placing secret values in source control.
          gcloud run jobs deploy ${INGESTION_JOB_NAME} \
            --project ${PROJECT_ID} \
            --image ${IMAGE_PATH} \
            --region ${REGION} \
            --command python \
            --args=-m,app.workers.document_ingestion \
            --cpu 1 \
            --memory 2Gi \
            --tasks 1 \
            --parallelism 1 \
            --task-timeout 1800s \
            --max-retries 0 \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --set-env-vars ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,DOCUMENT_INGESTION_BATCH_SIZE=5 \
            --set-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest

      - name: Deploy health-knowledge refresh job
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # Weekly refresh of the public MedlinePlus, DailyMed and RxNorm reference text
          # Nora cites. It reads only public sources and medication names; deployed beside
          # the service so its code never drifts behind the chat tools that read the cache.
          gcloud run jobs deploy ${KNOWLEDGE_JOB_NAME} \
            --project ${PROJECT_ID} \
            --image ${IMAGE_PATH} \
            --region ${REGION} \
            --command python \
            --args=-m,app.workers.health_knowledge_refresh \
            --cpu 1 \
            --memory 512Mi \
            --tasks 1 \
            --parallelism 1 \
            --task-timeout 1800s \
            --max-retries 0 \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --set-env-vars ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID} \
            --set-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest
