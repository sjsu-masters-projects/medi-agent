name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PROJECT_ID: medi-agent-490106
  REGION: us-central1
  SERVICE_NAME: mediagent-backend
  WORKER_SERVICE_NAME: mediagent-chat-worker
  INGESTION_JOB_NAME: mediagent-document-ingestion
  KNOWLEDGE_JOB_NAME: mediagent-health-knowledge-refresh
  # Fallback runtime identity for the services and jobs. The API and chat worker services use
  # the least-privilege accounts named by the repository variables CLOUD_RUN_API_RUNTIME_SA and
  # CLOUD_RUN_WORKER_RUNTIME_SA once those are set (see docs/chat-worker-setup.md); until then
  # they keep running as this account. The two jobs stay on this account.
  RUNTIME_SERVICE_ACCOUNT: github-actions-deployer@medi-agent-490106.iam.gserviceaccount.com

permissions:
  contents: read

# One deploy at a time, in push order. Two merges a few seconds apart once ran in
# parallel: the older build finished last, took the traffic and deleted the newer image.
# A queued run waits rather than cancelling the one in progress; when several are queued,
# only the newest runs, and it builds the latest main.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fail before building anything when a required runtime setting is missing, so a deploy
      # can never silently drop the Nora worker wiring. Names only are printed, never values.
      - name: Check required runtime settings
        env:
          CLOUD_TASKS_PROJECT: ${{ vars.CLOUD_TASKS_PROJECT }}
          CLOUD_TASKS_LOCATION: ${{ vars.CLOUD_TASKS_LOCATION }}
          CLOUD_TASKS_QUEUE: ${{ vars.CLOUD_TASKS_QUEUE }}
          CHAT_WORKER_URL: ${{ vars.CHAT_WORKER_URL }}
          CHAT_WORKER_INVOKER_SA: ${{ vars.CHAT_WORKER_INVOKER_SA }}
          CHAT_TURNS_VIA_WORKER: ${{ vars.CHAT_TURNS_VIA_WORKER }}
          CLOUD_RUN_API_RUNTIME_SA: ${{ vars.CLOUD_RUN_API_RUNTIME_SA }}
          CLOUD_RUN_WORKER_RUNTIME_SA: ${{ vars.CLOUD_RUN_WORKER_RUNTIME_SA }}
        run: |
          missing=0
          for name in CLOUD_TASKS_PROJECT CLOUD_TASKS_LOCATION CLOUD_TASKS_QUEUE CHAT_WORKER_URL CHAT_WORKER_INVOKER_SA CHAT_TURNS_VIA_WORKER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable ${name} is not set. Set it with: gh variable set ${name} --body <value>. See docs/chat-worker-setup.md (Repository variables)."
              missing=1
            fi
          done
          if [ -n "${CHAT_TURNS_VIA_WORKER}" ] && [ "${CHAT_TURNS_VIA_WORKER}" != "true" ] && [ "${CHAT_TURNS_VIA_WORKER}" != "false" ]; then
            echo "::error::CHAT_TURNS_VIA_WORKER must be exactly true or false."
            missing=1
          fi
          if [ -n "${CHAT_WORKER_URL}" ] && ! [[ "${CHAT_WORKER_URL}" =~ ^https://[^/]+$ ]]; then
            echo "::error::CHAT_WORKER_URL must be an https URL with no path or trailing slash."
            missing=1
          fi
          for name in CLOUD_RUN_API_RUNTIME_SA CLOUD_RUN_WORKER_RUNTIME_SA; do
            if [ -n "${!name}" ] && ! [[ "${!name}" =~ ^[a-z0-9-]+@${PROJECT_ID}\.iam\.gserviceaccount\.com$ ]]; then
              echo "::error::${name} must be a service account email in project ${PROJECT_ID}."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev

      - name: Create Artifact Registry Repository (if not exists)
        run: |
          gcloud artifacts repositories create cloud-run-source-deploy \
            --repository-format=docker \
            --location=${REGION} \
            --description="Docker repository for Cloud Run deployments" || true

      - name: Apply Artifact Registry cleanup policy
        run: |
          gcloud artifacts repositories set-cleanup-policies cloud-run-source-deploy \
            --location=${REGION} \
            --policy=backend/cleanup-policy.json

          gcloud artifacts repositories list-cleanup-policies cloud-run-source-deploy \
            --location=${REGION}

      - name: Build Docker Image
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"
          docker build -t $IMAGE_PATH ./backend
          docker push $IMAGE_PATH

      - name: Clean up old images
        run: |
          IMAGE_REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}"

          gcloud artifacts docker images list \
            "${IMAGE_REPO}" \
            --include-tags \
            --format="get(version)" \
            --filter="NOT tags:latest" | sort -u | while read -r digest; do
              if [ -z "${digest}" ]; then
                continue
              fi

              echo "Deleting old image: $digest"
              gcloud artifacts docker images delete \
                "${IMAGE_REPO}@${digest}" \
                --quiet
          done

      - name: Deploy to Cloud Run
        env:
          CLOUD_TASKS_PROJECT: ${{ vars.CLOUD_TASKS_PROJECT }}
          CLOUD_TASKS_LOCATION: ${{ vars.CLOUD_TASKS_LOCATION }}
          CLOUD_TASKS_QUEUE: ${{ vars.CLOUD_TASKS_QUEUE }}
          CHAT_WORKER_URL: ${{ vars.CHAT_WORKER_URL }}
          CHAT_WORKER_INVOKER_SA: ${{ vars.CHAT_WORKER_INVOKER_SA }}
          CHAT_TURNS_VIA_WORKER: ${{ vars.CHAT_TURNS_VIA_WORKER }}
          CLOUD_RUN_API_RUNTIME_SA: ${{ vars.CLOUD_RUN_API_RUNTIME_SA }}
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # Least-privilege identity: used only once the repository variable is set. Until
          # then the service keeps its current account (the one on the live revision).
          SA_FLAG=()
          if [ -n "${CLOUD_RUN_API_RUNTIME_SA}" ]; then
            SA_FLAG=(--service-account "${CLOUD_RUN_API_RUNTIME_SA}")
          else
            SA_FLAG=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi

          # Memory is pinned here on purpose. It was 512Mi, which silently reverted any
          # console change on the next deploy, and it is too small for the agent runtime.
          #
          # Environment and secrets use the --update-* forms, never --set-*. The service
          # also carries settings configured out of band (portal and callback URLs, SMART
          # client settings, Sentry and Resend options, SYMPTOM_INTAKE_ENABLED);
          # --set-env-vars and --set-secrets REPLACE the whole set and would wipe them on
          # the next push. --update-* merges, so anything not named here is preserved.
          #
          # The Nora worker wiring (CLOUD_TASKS_*, CHAT_WORKER_*, CHAT_TURNS_VIA_WORKER) comes
          # from repository variables, checked by the first step. Secrets are Secret Manager
          # references (ENV=SECRET:VERSION); no secret value appears in this file.
          #
          # --no-cpu-throttling keeps CPU allocated outside requests. A Nora reply is a
          # server-owned task that keeps running after its websocket closes, and a
          # throttled instance would stall it. Main service only; the jobs are unchanged.
          #
          # --min-instances 1 keeps one instance warm so the first message after idle does not
          # pay a cold start plus the first Cloud Tasks call (measured 2.1-6.3 s on a new
          # process). With CPU always allocated this instance is billed continuously (about one
          # vCPU and 2 GiB); the cost is accepted for chat latency. --cpu-boost gives extra CPU
          # while a new instance starts. See docs/chat-worker-setup.md, "Latency and cost".
          gcloud run deploy ${SERVICE_NAME} \
            --image $IMAGE_PATH \
            --region ${REGION} \
            --cpu 1 \
            --no-cpu-throttling \
            --memory 2Gi \
            --min-instances 1 \
            --cpu-boost \
            --max-instances 2 \
            --allow-unauthenticated \
            "${SA_FLAG[@]}" \
            --update-env-vars VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,CHAT_TURN_TIMEOUT_SECONDS=30,MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS=60,GOOGLE_PROJECT_ID=${PROJECT_ID},CLOUD_TASKS_PROJECT=${CLOUD_TASKS_PROJECT},CLOUD_TASKS_LOCATION=${CLOUD_TASKS_LOCATION},CLOUD_TASKS_QUEUE=${CLOUD_TASKS_QUEUE},CHAT_WORKER_URL=${CHAT_WORKER_URL},CHAT_WORKER_INVOKER_SA=${CHAT_WORKER_INVOKER_SA},CHAT_TURNS_VIA_WORKER=${CHAT_TURNS_VIA_WORKER} \
            --update-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,DEEPGRAM_API_KEY=DEEPGRAM_API_KEY:latest,BACKEND_SENTRY_DSN=BACKEND_SENTRY_DSN:latest,CRON_AUTH_TOKEN=CRON_AUTH_TOKEN:latest,RESEND_API_KEY=RESEND_API_KEY:latest,SMART_STATE_ENCRYPTION_KEY=MEDIAGENT_SMART_STATE_KEY:latest,NOTIFICATION_TOKEN_SIGNING_SECRET=NOTIFICATION_TOKEN_SIGNING_SECRET:1 \
            --port 8080 \
            --timeout 3600

      # OPS-006 phase 2. Creates and updates the Nora turn worker only when the repository
      # variable DEPLOY_CHAT_WORKER is "true", so merging this file creates nothing. The
      # worker is the same image started with WORKER_MODE=true: it serves /health and the
      # OIDC-protected task endpoint only, and Cloud Run rejects unauthenticated callers
      # before the application sees them. Request-based CPU (--cpu-throttling): a turn runs
      # inside its task request, so no CPU is needed between requests. See
      # docs/chat-worker-setup.md for the one-time resources this step expects (the invoker
      # service account, the queue and the repository variable CHAT_WORKER_INVOKER_SA).
      # --min-instances 1 keeps one worker warm: an idle instance on request-based CPU is billed
      # at the low idle rate, while a cold worker measured 30 s from dispatch to the first task.
      - name: Deploy chat worker service
        if: ${{ vars.DEPLOY_CHAT_WORKER == 'true' }}
        env:
          CHAT_WORKER_INVOKER_SA: ${{ vars.CHAT_WORKER_INVOKER_SA }}
          CLOUD_RUN_WORKER_RUNTIME_SA: ${{ vars.CLOUD_RUN_WORKER_RUNTIME_SA }}
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # Least-privilege identity once the repository variable is set; otherwise current behaviour.
          SA_FLAG=(--service-account "${CLOUD_RUN_WORKER_RUNTIME_SA:-${RUNTIME_SERVICE_ACCOUNT}}")

          if [ -z "${CHAT_WORKER_INVOKER_SA}" ]; then
            echo "::error::Set the repository variable CHAT_WORKER_INVOKER_SA before enabling DEPLOY_CHAT_WORKER."
            exit 1
          fi

          # Environment and secrets use the --update-* forms, as for the API: anything not
          # named here is preserved. The worker needs the database and the model; it has no
          # user-facing secrets (no Resend, Deepgram or SMART).
          gcloud run deploy ${WORKER_SERVICE_NAME} \
            --image $IMAGE_PATH \
            --region ${REGION} \
            --cpu 1 \
            --cpu-throttling \
            --memory 2Gi \
            --min-instances 1 \
            --cpu-boost \
            --max-instances 3 \
            --concurrency 4 \
            --timeout 300 \
            --port 8080 \
            --no-allow-unauthenticated \
            "${SA_FLAG[@]}" \
            --update-env-vars WORKER_MODE=true,ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID},CHAT_WORKER_INVOKER_SA=${CHAT_WORKER_INVOKER_SA},VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,CHAT_TURN_TIMEOUT_SECONDS=30,MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS=60,A2A_RETRY_WORKER_ENABLED=false \
            --update-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest

          # The OIDC audience is the service's own URL, known only after it exists. Setting
          # it as an environment variable (not a secret) keeps the worker self-describing.
          WORKER_URL="$(gcloud run services describe ${WORKER_SERVICE_NAME} --region ${REGION} --format='value(status.url)')"
          gcloud run services update ${WORKER_SERVICE_NAME} \
            --region ${REGION} \
            --update-env-vars CHAT_WORKER_URL=${WORKER_URL},CHAT_WORKER_OIDC_AUDIENCE=${WORKER_URL}
          echo "Worker URL (use it as CHAT_WORKER_URL on the API service): ${WORKER_URL}"

      - name: Deploy document-ingestion job
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # A Cloud Run Job resolves an image tag to a digest at deploy time. Updating
          # it beside the backend service prevents its OCR/extraction code from drifting
          # behind the request path after a later backend release. This command is also
          # safe as the initial creation path: it declares the whole worker runtime
          # contract without ever placing secret values in source control.
          gcloud run jobs deploy ${INGESTION_JOB_NAME} \
            --project ${PROJECT_ID} \
            --image ${IMAGE_PATH} \
            --region ${REGION} \
            --command python \
            --args=-m,app.workers.document_ingestion \
            --cpu 1 \
            --memory 2Gi \
            --tasks 1 \
            --parallelism 1 \
            --task-timeout 1800s \
            --max-retries 0 \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --set-env-vars ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID},VERTEX_AI_LOCATION=global,GEMINI_VERTEX_AI_LOCATION=global,GEMINI_TRIAGE_MODEL=gemini-3.5-flash-lite,GEMINI_FLASH_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODEL=gemini-3.5-flash,GEMINI_PRO_MODEL=gemini-3.1-pro-preview,DOCUMENT_INGESTION_BATCH_SIZE=5 \
            --set-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest

      - name: Deploy health-knowledge refresh job
        run: |
          IMAGE_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${SERVICE_NAME}:latest"

          # Weekly refresh of the public MedlinePlus, DailyMed and RxNorm reference text
          # Nora cites. It reads only public sources and medication names; deployed beside
          # the service so its code never drifts behind the chat tools that read the cache.
          gcloud run jobs deploy ${KNOWLEDGE_JOB_NAME} \
            --project ${PROJECT_ID} \
            --image ${IMAGE_PATH} \
            --region ${REGION} \
            --command python \
            --args=-m,app.workers.health_knowledge_refresh \
            --cpu 1 \
            --memory 512Mi \
            --tasks 1 \
            --parallelism 1 \
            --task-timeout 1800s \
            --max-retries 0 \
            --service-account ${RUNTIME_SERVICE_ACCOUNT} \
            --set-env-vars ENVIRONMENT=production,GOOGLE_PROJECT_ID=${PROJECT_ID} \
            --set-secrets SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,SUPABASE_JWT_SECRET=SUPABASE_JWT_SECRET:latest
