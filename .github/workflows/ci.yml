name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  # ── Backend Pipeline ──────────────────────────────────────
  backend-ruff-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check src/

  backend-ruff-format:
    name: Backend Format Check (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Format check (Ruff)
        run: ruff format --check src/

  backend-mypy:
    name: Backend Type Check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

  backend-test:
    name: Backend Test (pytest)
    needs:
      - backend-ruff-lint
      - backend-ruff-format
      - backend-mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Test (pytest)
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret-for-ci"
        run: pytest tests/ -v --tb=short

  # ── Patient Portal Pipeline ──────────────────────────────
  patient-lint:
    name: Patient Portal Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/patient-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint

  patient-build:
    name: Patient Portal Build
    needs: patient-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/patient-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ── Clinician Portal Pipeline ────────────────────────────
  clinician-lint:
    name: Clinician Portal Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/clinician-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint

  clinician-build:
    name: Clinician Portal Build
    needs: clinician-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/clinician-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ── Pipeline Completion ──────────────────────────────────
  ci-success:
    name: CI Pipeline Passed 🎉
    if: ${{ always() }}
    needs:
      - backend-ruff-lint
      - backend-ruff-format
      - backend-mypy
      - backend-test
      - patient-lint
      - patient-build
      - clinician-lint
      - clinician-build
    runs-on: ubuntu-latest
    steps:
      - name: Report dependency results
        run: |
          echo "backend-ruff-lint=${{ needs.backend-ruff-lint.result }}"
          echo "backend-ruff-format=${{ needs.backend-ruff-format.result }}"
          echo "backend-mypy=${{ needs.backend-mypy.result }}"
          echo "backend-test=${{ needs.backend-test.result }}"
          echo "patient-lint=${{ needs.patient-lint.result }}"
          echo "patient-build=${{ needs.patient-build.result }}"
          echo "clinician-lint=${{ needs.clinician-lint.result }}"
          echo "clinician-build=${{ needs.clinician-build.result }}"

      - name: Fail if any dependency did not succeed
        run: |
          [[ "${{ needs.backend-ruff-lint.result }}" == "success" ]] || exit 1
          [[ "${{ needs.backend-ruff-format.result }}" == "success" ]] || exit 1
          [[ "${{ needs.backend-mypy.result }}" == "success" ]] || exit 1
          [[ "${{ needs.backend-test.result }}" == "success" ]] || exit 1
          [[ "${{ needs.patient-lint.result }}" == "success" ]] || exit 1
          [[ "${{ needs.patient-build.result }}" == "success" ]] || exit 1
          [[ "${{ needs.clinician-lint.result }}" == "success" ]] || exit 1
          [[ "${{ needs.clinician-build.result }}" == "success" ]] || exit 1
