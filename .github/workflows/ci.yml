name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
  # Weekly safety net: the full suite including the Docker PostgreSQL contracts.
  schedule:
    - cron: "0 9 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  changes:
    # Decides whether the slow database contract suites are relevant. Pushes to main skip
    # them (the pull request already ran them); schedule, manual and merge-queue runs and
    # any pull request touching backend SQL, services, routers, migrations, integration
    # tests, dependencies or this workflow run them.
    name: Detect backend contract scope
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.scope.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "postgres=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(backend/src/app/(db|services|routers|agents|safety)/|backend/src/app/.*\.sql$|backend/tests/integration/|backend/requirements|backend/pyproject\.toml|\.github/workflows/ci\.yml)'; then
            echo "postgres=true" >> "$GITHUB_OUTPUT"
          else
            echo "postgres=false" >> "$GITHUB_OUTPUT"
          fi

  pr-policy:
    name: PR Policy Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required PR checklist items
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const body = pullRequest.body || "";
            const requiredChecks = [
              "I have read `CONTRIBUTING.md` and `.agent/CODING_STANDARDS.md`.",
              "My code follows the architecture in `.agent/ARCHITECTURE.md`.",
              "I ran required lint checks for touched surfaces (`ruff` / `eslint`).",
              "I ran required type/test checks for touched surfaces (`mypy` / `pytest` / frontend tests/build).",
              "I added or updated tests for changed behavior, or documented why tests are not applicable.",
              "I verified no secrets or credentials were added (including `.env*`, keys, tokens, service-account files).",
              "I listed manual verification steps below.",
            ];

            const missing = requiredChecks.filter((item) => !body.includes(`- [x] ${item}`));
            if (missing.length > 0) {
              core.setFailed(
                "PR checklist policy failed. Mark these items as completed in the PR body:\n- "
                + missing.join("\n- ")
              );
            } else {
              core.info("PR checklist policy passed.");
            }

  # ── Backend Pipeline ──────────────────────────────────────
  backend-dependency-lock:
    name: Backend Dependency Lock & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.9.24"
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements.in
            backend/requirements-dev.in
      - name: Verify compiled dependency locks
        run: |
          uv pip compile requirements.in --universal --python-version 3.12 --output-file requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 --output-file requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt
      - name: Audit locked Python dependencies
        # GHSA-xcq7-p3pf-p88h (CVE-2026-114603, opentelemetry-api tracestate parsing) is
        # accepted until google-adk allows opentelemetry-api>=1.45.1 (2.12.0 still caps it at
        # 1.42.1). It is reachable only when inbound request headers are extracted by an
        # OpenTelemetry propagator; the app installs no instrumentation package and never
        # imports opentelemetry, which tests/unit/test_dependency_audit_exceptions.py enforces.
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements-dev.txt --ignore-vuln GHSA-xcq7-p3pf-p88h

  production-placeholder-check:
    name: Production Placeholder Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject empty modules and placeholder handlers
        run: python backend/scripts/check_production_placeholders.py

  backend-ruff-lint:
    name: Backend Lint (Ruff)
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check src/ scripts/

  backend-ruff-format:
    name: Backend Format Check (Ruff)
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Format check (Ruff)
        run: ruff format --check src/ scripts/

  backend-mypy:
    name: Backend Type Check (mypy)
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Restore the mypy incremental cache
        # Speed only: mypy re-checks anything whose source or dependencies changed, so a stale
        # cache can never hide an error. Keyed on the lockfiles; the newest cache is reused.
        uses: actions/cache@v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt', 'backend/pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('backend/requirements-dev.txt', 'backend/pyproject.toml') }}-
      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports

  backend-test-impact:
    name: Backend Test Impact (Acquit)
    # Lint, format and mypy gate the merge through CI Summary; tests no longer wait for them.
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Acquit needs the PR base locally and fails closed on shallow clones.
          fetch-depth: 0
      - name: Select affected tests with Acquit (enforced)
        id: acquit
        if: github.event_name == 'pull_request'
        uses: rajeev-chaurasia/acquit@ca647e83986768b62b50343ec7b23dff87921293 # v0.3.0
        with:
          acquit-version: "0.3.0"
          comment: "true"
          # enforce: the backend test shards honour the verified selection and skip only test
          # files Acquit proves unaffected. Fail-closed: any analysis error, policy finding
          # (migrations, CI config, sys.path mutation) or tree mismatch means run-all.
          mode: enforce
          working-directory: .
      - name: Share the verified selection with the test shards
        if: github.event_name == 'pull_request' && steps.acquit.outputs.selection-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: acquit-selection
          path: ${{ steps.acquit.outputs.selection-file }}
          if-no-files-found: ignore
          retention-days: 7

  backend-test:
    name: Backend Tests (${{ matrix.name }})
    # Acquit decides what to skip on pull requests; tests run in parallel with lint and mypy.
    needs:
      - backend-dependency-lock
      - backend-test-impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration-routers
            args: tests/integration/routers
          - name: integration-workflows
            args: tests/integration --ignore=tests/integration/routers
          - name: unit-foundation
            args: tests/unit/adk tests/unit/agents tests/unit/clients tests/unit/core tests/unit/db tests/unit/middleware tests/unit/safety tests/unit/tools tests/unit/test_adherence_service.py tests/unit/test_app_boot.py tests/unit/test_document_service.py tests/unit/test_mcp_servers.py tests/unit/test_models.py tests/unit/test_risk_score_service.py tests/unit/test_security.py
          - name: unit-services
            args: tests/unit/services
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Expose PostgreSQL server binaries
        if: matrix.name == 'integration-workflows'
        run: |
          pg_bin="$(pg_config --bindir)"
          for tool in initdb pg_ctl psql postgres; do
            test -x "$pg_bin/$tool" || { echo "Missing PostgreSQL server tool: $tool" >&2; exit 1; }
          done
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/postgres" --version
      - name: Fetch the Acquit selection
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: acquit-selection
          # Outside the repository: Acquit fingerprints the working tree before honouring it.
          path: ${{ runner.temp }}/acquit
      - name: Enable the Acquit selection
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          # No file means no selection: the plugin stays inert and every test runs.
          selection="$(find "${RUNNER_TEMP}/acquit" -name '*.json' ! -name '*canary*' -print -quit 2>/dev/null || true)"
          if [ -n "$selection" ]; then
            echo "ACQUIT_SELECTION_FILE=$selection" >> "$GITHUB_ENV"
            echo "Acquit selection: $selection"
          else
            echo "No Acquit selection; running every test in this shard."
          fi
      - name: Test shard (pytest)
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret-for-ci"
        run: |
          mkdir -p test-results
          pytest ${{ matrix.args }} -v --tb=short --no-cov --junitxml=test-results/${{ matrix.name }}.xml
      - name: Upload pytest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.name }}
          path: backend/test-results/${{ matrix.name }}.xml
          if-no-files-found: warn
          retention-days: 14

  backend-coverage:
    name: Backend Coverage (full suite)
    # Pull requests, merge queue, manual and weekly runs; a push to main repeats a PR run.
    if: github.event_name != 'push'
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    # The Docker PostgreSQL contract suites run in parallel in backend-postgres-contracts.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Expose PostgreSQL server binaries
        run: |
          pg_bin="$(pg_config --bindir)"
          for tool in initdb pg_ctl psql postgres; do
            test -x "$pg_bin/$tool" || { echo "Missing PostgreSQL server tool: $tool" >&2; exit 1; }
          done
          echo "$pg_bin" >> "$GITHUB_PATH"
          "$pg_bin/postgres" --version
      - name: Enforce full-suite coverage
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret-for-ci"
        run: |
          mkdir -p test-results
          pytest tests/ -v -rs --tb=short --junitxml=test-results/full-suite.xml
      - name: Require real appointment transaction coverage
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = [
              case for case in ET.parse("test-results/full-suite.xml").iter("testcase")
              if case.get("classname", "").endswith("test_appointment_offer_transactions")
          ]
          blocked = [
              case.get("name") for case in cases
              if any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))
          ]
          if len(cases) < 31 or blocked:
              raise SystemExit(f"Appointment PostgreSQL coverage incomplete: {len(cases)} cases; non-passing: {blocked}")
          print(f"Verified {len(cases)} real appointment PostgreSQL transaction tests passed; zero skips.")
          PY
      - name: Upload coverage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-suite
          path: backend/test-results/full-suite.xml
          if-no-files-found: warn
          retention-days: 14

  backend-postgres-contracts:
    # Disposable postgres:16 containers (--network=none) apply every migration from scratch
    # and check the SQL that unit tests fake: triggers, RLS, grants and RPCs. Nothing here
    # touches a hosted database. Kept out of the coverage job so the two run in parallel.
    name: Backend PostgreSQL contracts (${{ matrix.name }})
    if: github.event_name != 'push' && needs.changes.outputs.postgres == 'true'
    needs:
      - changes
      - backend-dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: notification-centre
            files: tests/integration/test_notification_centre_postgres.py
            minimums: test_notification_centre_postgres=58
          - name: email-scheduling-and-grants
            files: tests/integration/test_email_postgres.py tests/integration/test_clinic_scheduling_postgres.py tests/integration/test_public_grants_postgres.py
            minimums: test_email_postgres=31 test_clinic_scheduling_postgres=19 test_public_grants_postgres=4
          - name: clinical-review-and-timeline
            files: tests/integration/test_unlisted_product_review_postgres.py tests/integration/test_patient_timeline_postgres.py
            minimums: test_unlisted_product_review_postgres=10 test_patient_timeline_postgres=6
          - name: reconciliation-lifecycle
            files: tests/integration/test_reconciliation_postgres.py
            minimums: test_reconciliation_postgres=44
          - name: external-record-reviews
            files: tests/integration/test_external_record_reviews_postgrest.py
            minimums: test_external_record_reviews_postgrest=1
          - name: adr-and-medwatch
            files: tests/integration/test_adr_loop_postgres.py tests/integration/test_medwatch_3500_postgres.py
            minimums: test_adr_loop_postgres=38 test_medwatch_3500_postgres=14
          - name: adr-naranjo-answers
            # Patient and clinician Naranjo answer paths, evidence, audit and the stale-payload
            # guard (100), on the whole ledger. Kept apart from adr-and-medwatch: the two
            # fixtures share fixture names and cannot run in one session.
            files: tests/integration/test_adr_naranjo_answers_postgres.py
            minimums: test_adr_naranjo_answers_postgres=14
          - name: care-conversations
            files: tests/integration/test_care_conversation_postgres.py tests/integration/test_clinic_memberships_postgres.py
            minimums: test_care_conversation_postgres=45 test_clinic_memberships_postgres=38
          - name: chat-turns
            # Nora turn recovery (072-077).
            files: tests/integration/test_chat_turn_postgres.py
            minimums: test_chat_turn_postgres=47
          - name: chat-turn-events
            # The worker queue, events and claim (078), the AI availability counters (090) and
            # the rolling conversation summary and per-reply evidence (094).
            files: tests/integration/test_chat_turn_events_postgres.py tests/integration/test_ai_availability_postgres.py tests/integration/test_nora_continuity_postgres.py
            minimums: test_chat_turn_events_postgres=35 test_ai_availability_postgres=12 test_nora_continuity_postgres=14
          - name: loc003-translation-schema
            # Message-translation integrity and retention, the wording-verification
            # record, display provenance and atomic confirmed sends (080-082, 088).
            files: tests/integration/test_loc003_translation_postgres.py tests/integration/test_confirmed_translation_postgres.py
            minimums: test_loc003_translation_postgres=31 test_confirmed_translation_postgres=15
          - name: care-team-plans
            # Plan ownership, routed documents, shared core, cross-plan publication and
            # notification scoping and record owners and follow-ups (083-087, 092). Disposable containers, no remote database.
            files: tests/integration/test_care_team_plans_postgres.py tests/integration/test_care_team_records_postgres.py tests/integration/test_care_team_publication_postgres.py tests/integration/test_care_team_notifications_postgres.py tests/integration/test_care_team_record_owner_postgres.py tests/integration/test_care_team_followups_postgres.py
            minimums: test_care_team_plans_postgres=25 test_care_team_records_postgres=35 test_care_team_publication_postgres=38 test_care_team_notifications_postgres=24 test_care_team_record_owner_postgres=14 test_care_team_followups_postgres=9
          - name: patient-records
            # Removal authorization/audit (101) and explanation-cache permissions (102).
            files: tests/integration/test_patient_document_removal_postgres.py tests/integration/test_document_presentation_postgres.py
            minimums: test_patient_document_removal_postgres=24 test_document_presentation_postgres=6
          - name: confirmed-symptoms
            image: postgres:16-alpine
            files: tests/integration/test_symptom_intake_postgres.py tests/integration/test_symptom_handoff_postgres.py tests/integration/test_symptom_report_history_postgres.py
            minimums: test_symptom_intake_postgres=17 test_symptom_handoff_postgres=8 test_symptom_report_history_postgres=11
          - name: medication-confirmations
            # Patient medication confirmation requests (093): care-team ownership, patient
            # testimony that applies nothing, idempotency, expiry, immutability, grants; and
            # the patient notification-centre alert for a question (099), including that the
            # handoff-share (096) and symptom-review (095) items still work through the wrappers.
            files: tests/integration/test_medication_confirmations_postgres.py tests/integration/test_medication_question_alert_postgres.py
            minimums: test_medication_confirmations_postgres=17 test_medication_question_alert_postgres=10
          - name: symptom-review-notifications
            # The patient notice when a care team reviews a confirmed report and the report id
            # on the hand-off message (095), on the whole ledger. Disposable containers.
            files: tests/integration/test_symptom_review_notifications_postgres.py
            minimums: test_symptom_review_notifications_postgres=8
          - name: chat-safety
            image: postgres:16-alpine
            # Safety-floor alerts: every floor rule is accepted, typed and delivered (059, 097),
            # plus the per-turn safety audit. Disposable containers, no remote database.
            files: tests/integration/test_chat_safety_postgres.py
            minimums: test_chat_safety_postgres=27
          - name: care-handoff
            # Reviewed care-handoff summaries (089): ownership, append-only versions, approval
            # and export gating, concurrency, action-table permissions/idempotency, and sharing an approved version with a colleague
            # (096: recipients, revoke, version pinning, unlinked recipient, notification).
            # Opt-in env is set by the job.
            files: tests/integration/test_care_handoff_summaries_postgres.py tests/integration/test_care_handoff_shares_postgres.py tests/integration/test_clinical_action_postgres.py
            minimums: test_care_handoff_summaries_postgres=21 test_care_handoff_shares_postgres=28 test_clinical_action_postgres=14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pull the PostgreSQL image
        run: docker pull ${{ matrix.image || 'postgres:16' }}
      - name: Pull the PostgREST contract image
        if: matrix.name == 'external-record-reviews'
        run: docker pull postgrest/postgrest:v14.1
      - name: Run the contract suites
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret-for-ci"
          CARE_CONVERSATION_TEST_POSTGRES_DOCKER: "1"
          NOTIFICATION_CENTRE_TEST_POSTGRES_DOCKER: "1"
          EMAIL_TEST_POSTGRES_DOCKER: "1"
          CHAT_TURN_TEST_POSTGRES_DOCKER: "1"
          LOC003_TEST_POSTGRES: "1"
          LOC003_TEST_POSTGRES_DOCKER: "1"
          CARE_TEAM_PLANS_TEST_POSTGRES_DOCKER: "1"
          SYMPTOM_INTAKE_TEST_POSTGRES: "1"
          CHAT_SAFETY_TEST_POSTGRES: "1"
          CHAT_SAFETY_TEST_POSTGRES_DOCKER: "1"
          EXTERNAL_REVIEW_TEST_POSTGREST_DOCKER: "1"
        run: |
          mkdir -p test-results
          pytest ${{ matrix.files }} -v -rs --tb=short --no-cov --junitxml=test-results/postgres-${{ matrix.name }}.xml
      - name: Require every contract case to run
        env:
          RESULTS: test-results/postgres-${{ matrix.name }}.xml
          MINIMUMS: ${{ matrix.minimums }}
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(os.environ["RESULTS"]).iter("testcase"))
          problems = []
          for entry in os.environ["MINIMUMS"].split():
              module, minimum = entry.split("=")
              mine = [case for case in cases if case.get("classname", "").endswith(module)]
              blocked = [
                  case.get("name") for case in mine
                  if any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))
              ]
              if len(mine) < int(minimum) or blocked:
                  problems.append(f"{module}: {len(mine)} cases (need {minimum}); non-passing: {blocked}")
              else:
                  print(f"Verified {len(mine)} {module} cases passed; zero skips.")
          if problems:
              raise SystemExit("PostgreSQL contract coverage incomplete: " + "; ".join(problems))
          PY
      - name: Upload contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ matrix.name }}
          path: backend/test-results/postgres-${{ matrix.name }}.xml
          if-no-files-found: warn
          retention-days: 14

  migration-validation:
    name: Database Migration Syntax
    needs: backend-dependency-lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate migration names, order, and PostgreSQL syntax
        run: python scripts/validate_migrations.py

  secret-scan:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history in this change
        uses: trufflesecurity/trufflehog@v3.97.0
        with:
          version: "3.97.0"
          extra_args: --no-verification

  # ── Patient Portal Pipeline ──────────────────────────────
  patient-lint:
    name: Patient Portal Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/patient-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (TypeScript)
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm run test

  patient-build:
    name: Patient Portal Build
    needs: patient-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/patient-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ── Clinician Portal Pipeline ────────────────────────────
  clinician-lint:
    name: Clinician Portal Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/clinician-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check bilingual review inventory
        working-directory: .
        run: |
          node --test scripts/extract-spanish-review.test.mjs
          python3 backend/scripts/build_spanish_review_pack.py --check --require-reviewed
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check (TypeScript)
        run: npm run typecheck
      - name: Test (Vitest)
        run: npm run test

  clinician-build:
    name: Clinician Portal Build
    needs: clinician-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/clinician-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/clinician-portal/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  documentation:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test scripts/tests/check-docs.test.mjs
      - run: node scripts/check-docs.mjs --all

  ci-summary:
    name: CI Summary
    if: always()
    needs:
      - backend-ruff-lint
      - backend-ruff-format
      - backend-mypy
      - backend-dependency-lock
      - production-placeholder-check
      - backend-test-impact
      - backend-test
      - backend-coverage
      - backend-postgres-contracts
      - migration-validation
      - secret-scan
      - patient-build
      - clinician-build
      - documentation
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed-job durations
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            const rows = jobs
              .filter((job) => job.name !== "CI Summary" && job.started_at && job.completed_at)
              .map((job) => {
                const seconds = Math.round(
                  (Date.parse(job.completed_at) - Date.parse(job.started_at)) / 1000,
                );
                return [job.name, job.conclusion ?? "in progress", `${seconds}s`];
              });
            await core.summary
              .addHeading("Completed-job durations", 2)
              .addTable([[{ data: "Job", header: true }, { data: "Result", header: true }, { data: "Duration", header: true }], ...rows])
              .write({ overwrite: false });
      - name: Publish required-check outcomes
        env:
          RUFF_LINT: ${{ needs.backend-ruff-lint.result }}
          RUFF_FORMAT: ${{ needs.backend-ruff-format.result }}
          MYPY: ${{ needs.backend-mypy.result }}
          BACKEND_LOCK: ${{ needs.backend-dependency-lock.result }}
          PLACEHOLDERS: ${{ needs.production-placeholder-check.result }}
          BACKEND_IMPACT: ${{ needs.backend-test-impact.result }}
          BACKEND_TESTS: ${{ needs.backend-test.result }}
          BACKEND_COVERAGE: ${{ needs.backend-coverage.result }}
          POSTGRES_CONTRACTS: ${{ needs.backend-postgres-contracts.result }}
          MIGRATIONS: ${{ needs.migration-validation.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          PATIENT: ${{ needs.patient-build.result }}
          CLINICIAN: ${{ needs.clinician-build.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
        run: |
          {
            echo "## MediAgent CI summary"
            echo
            echo "| Required check | Result |"
            echo "| --- | --- |"
            echo "| Dependency lock and audit | ${BACKEND_LOCK} |"
            echo "| Production placeholder check | ${PLACEHOLDERS} |"
            echo "| Acquit test selection | ${BACKEND_IMPACT} |"
            echo "| Backend test shards | ${BACKEND_TESTS} |"
            echo "| Backend full-suite coverage | ${BACKEND_COVERAGE} |"
            echo "| PostgreSQL contract suites | ${POSTGRES_CONTRACTS} |"
            echo "| Migration validation | ${MIGRATIONS} |"
            echo "| Secret scan | ${SECRETS} |"
            echo "| Patient portal | ${PATIENT} |"
            echo "| Clinician portal | ${CLINICIAN} |"
            echo "| Documentation links | ${DOCUMENTATION} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$RUFF_LINT" = success
          test "$RUFF_FORMAT" = success
          test "$MYPY" = success
          test "$BACKEND_LOCK" = success
          test "$PLACEHOLDERS" = success
          test "$BACKEND_IMPACT" = success
          test "$BACKEND_TESTS" = success
          # Skipped means "not applicable" (push to main, or no backend SQL change); the
          # lint and type jobs above are required, so a skip caused by a failure cannot pass.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "$BACKEND_COVERAGE" = skipped
            test "$POSTGRES_CONTRACTS" = skipped
          else
            test "$BACKEND_COVERAGE" = success
            test "$POSTGRES_CONTRACTS" = success -o "$POSTGRES_CONTRACTS" = skipped
          fi
          test "$MIGRATIONS" = success
          test "$SECRETS" = success
          test "$PATIENT" = success
          test "$CLINICIAN" = success
          test "$DOCUMENTATION" = success
